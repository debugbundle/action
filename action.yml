name: Fetch DebugBundle Bundle
description: Fetch privacy-projected DebugBundle artifacts into the canonical cloud cache.

inputs:
  incident-id:
    description: Incident identifier to fetch from DebugBundle.
    required: true
  debugbundle-token:
    description: DebugBundle member token with permission to fetch incident artifacts.
    required: true
  api-base-url:
    description: Base DebugBundle API URL.
    required: false
    default: https://api.debugbundle.com
  workspace-root:
    description: Workspace path where the .debugbundle cloud cache should be written.
    required: false
    default: .

outputs:
  bundle-path:
    description: Path to the fetched bundle JSON file.
    value: ${{ steps.fetch.outputs.bundle-path }}
  reproduction-path:
    description: Path to the fetched reproduction JSON file.
    value: ${{ steps.fetch.outputs.reproduction-path }}
  reproduction-status:
    description: Reproduction fetch status (available, pending, or not_found).
    value: ${{ steps.fetch.outputs.reproduction-status }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        INPUT_INCIDENT_ID: ${{ inputs.incident-id }}
        INPUT_DEBUGBUNDLE_TOKEN: ${{ inputs.debugbundle-token }}
        INPUT_API_BASE_URL: ${{ inputs.api-base-url }}
        INPUT_WORKSPACE_ROOT: ${{ inputs.workspace-root }}
      run: |
        node --input-type=module <<'EOF'
        import { appendFileSync } from 'node:fs';
        import { mkdir, writeFile, rm } from 'node:fs/promises';
        import { join } from 'node:path';

        const incidentId = process.env.INPUT_INCIDENT_ID;
        const token = process.env.INPUT_DEBUGBUNDLE_TOKEN;
        const apiBaseUrl = (process.env.INPUT_API_BASE_URL ?? 'https://api.debugbundle.com').replace(/\/$/, '');
        let origin;
        try { origin = new URL(apiBaseUrl); } catch { throw new Error('Invalid DebugBundle API URL'); }
        if (origin.username || origin.password || (origin.protocol !== 'https:' &&
            !(origin.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(origin.hostname)))) {
          throw new Error('Invalid DebugBundle API URL');
        }
        const workspaceRoot = process.env.INPUT_WORKSPACE_ROOT ?? '.';
        const policyVersion = 'telemetry-privacy-v1';
        const maxArtifactBytes = 512 * 1024;

        if (!incidentId || !/^[A-Za-z0-9_-]{1,128}$/.test(incidentId)) {
          throw new Error('incident-id input is invalid');
        }

        if (!token) {
          throw new Error('debugbundle-token input is required');
        }

        const bundleDirectory = join(workspaceRoot, '.debugbundle', 'bundles', 'cloud');
        const reproductionDirectory = join(bundleDirectory, 'reproductions');
        const bundlePath = join(bundleDirectory, `${incidentId}.bundle.json`);
        const reproductionPath = join(reproductionDirectory, `${incidentId}.reproduction.json`);

        await mkdir(reproductionDirectory, { recursive: true, mode: 0o700 });
        // A failed fetch must not leave a previous unprotected artifact at the advertised path.
        await rm(bundlePath, { force: true });
        await rm(reproductionPath, { force: true });

        function setOutput(name, value) {
          appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value)}\n`);
        }

        async function requestJson(relativePath) {
          let response;
          try {
          response = await fetch(`${apiBaseUrl}${relativePath}`, {
            redirect: 'error', signal: AbortSignal.timeout(30_000),
            headers: {
              Accept: 'application/json',
              Authorization: `Bearer ${token}`,
            },
          });
          } catch { throw new Error('DebugBundle artifact fetch unavailable'); }

          const length = Number(response.headers.get('content-length'));
          if (Number.isFinite(length) && length > maxArtifactBytes) {
            await response.body?.cancel();
            throw new Error('DebugBundle artifact exceeds the privacy output limit');
          }
          const reader = response.body?.getReader();
          const chunks = [];
          let totalBytes = 0;
          if (reader) {
            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                totalBytes += value.byteLength;
                if (totalBytes > maxArtifactBytes) {
                  throw new Error('DebugBundle artifact exceeds the privacy output limit');
                }
                chunks.push(value);
              }
            } finally {
              await reader.cancel().catch(() => undefined);
            }
          }
          const text = new TextDecoder('utf-8', { fatal: true }).decode(Buffer.concat(chunks));
          let payload = null;

          if (text.length > 0) {
            try {
              payload = JSON.parse(text);
            } catch {
              throw new Error('DebugBundle returned an invalid artifact response');
            }
          }

          return { response, payload };
        }

        const bundleResult = await requestJson(`/v1/incidents/${incidentId}/bundle`);
        if (!bundleResult.response.ok) {
          throw new Error(`Bundle fetch failed with HTTP ${bundleResult.response.status}`);
        }

        if (bundleResult.payload === null || typeof bundleResult.payload !== 'object' || Array.isArray(bundleResult.payload)) {
          throw new Error('Bundle fetch returned an invalid artifact');
        }
        if ('status' in bundleResult.payload) {
          throw new Error('Bundle fetch returned non-ready status');
        }

        if (bundleResult.response.headers.get('x-debugbundle-privacy-policy') !== policyVersion) {
          throw new Error('Bundle response lacks the required privacy projection');
        }

        await writeFile(bundlePath, `${JSON.stringify(bundleResult.payload, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });

        const reproductionResult = await requestJson(`/v1/incidents/${incidentId}/reproduction`);
        let reproductionStatus = 'available';

        if (reproductionResult.response.status === 404) {
          reproductionStatus = 'not_found';
        } else if (!reproductionResult.response.ok) {
          throw new Error(`Reproduction fetch failed with HTTP ${reproductionResult.response.status}`);
        } else if (
          reproductionResult.payload !== null &&
          typeof reproductionResult.payload === 'object' &&
          'status' in reproductionResult.payload &&
          reproductionResult.payload.status === 'pending'
        ) {
          reproductionStatus = 'pending';
        }

        if (reproductionStatus === 'available' && (reproductionResult.payload === null || typeof reproductionResult.payload !== 'object' || Array.isArray(reproductionResult.payload))) {
          throw new Error('Reproduction response is invalid');
        }
        if (reproductionStatus === 'available' && reproductionResult.response.headers.get('x-debugbundle-privacy-policy') !== policyVersion) {
          throw new Error('Reproduction response lacks the required privacy projection');
        }

        await writeFile(reproductionPath, `${JSON.stringify(reproductionStatus === 'available' ? reproductionResult.payload : { status: reproductionStatus }, null, 2)}\n`, { encoding: 'utf8', mode: 0o600 });

        setOutput('bundle-path', bundlePath);
        setOutput('reproduction-path', reproductionPath);
        setOutput('reproduction-status', reproductionStatus);
        EOF
