name: Action Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify artifact privacy boundary
        run: node --test test/action.test.mjs

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const { readFileSync, existsSync } = require('node:fs');

          if (!/^v2\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME ?? '')) {
            throw new Error('This privacy-protected candidate requires a v2 release tag');
          }
          const manifest = JSON.parse(readFileSync('release-manifest.json', 'utf8'));
          if (manifest.distributionRef !== 'debugbundle/action@v2') {
            throw new Error(`Unexpected distribution ref: ${manifest.distributionRef}`);
          }

          for (const fileName of manifest.requiredReleaseFiles) {
            if (!existsSync(fileName)) {
              throw new Error(`Missing required release file: ${fileName}`);
            }
          }
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "debugbundle/action ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
